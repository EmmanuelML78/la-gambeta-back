name: Backend CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
      - run: pnpm exec jest --runInBand --no-cache
      - run: pnpm exec tsc --noEmit --incremental false
      - run: pnpm build

  auth-integration:
    name: Migrations and auth integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: la_gambeta_auth_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d la_gambeta_auth_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USERNAME: ci
      DATABASE_PASSWORD: ci-only-password
      DATABASE_NAME: la_gambeta_auth_e2e
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:auth:integration
